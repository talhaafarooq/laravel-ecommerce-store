# Nginx + PHP-FPM server block for ShopNest (the Laravel equivalent of Nginx + Gunicorn).
# Copy to /etc/nginx/sites-available/shopnest and symlink into sites-enabled.

server {
    listen 80;
    listen [::]:80;
    server_name shop.example.com;

    # Redirect everything to HTTPS (certificates via certbot --nginx).
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shop.example.com;

    root /var/www/shopnest/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/shop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.com/privkey.pem;

    client_max_body_size 32M;   # product image uploads (validated to 4 MB each)

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fingerprinted Vite assets never change: cache for a year.
    location /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploaded media (public disk, linked with `php artisan storage:link`).
    location /storage/ {
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles (except ACME challenges) or anything outside public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
