; Long-running processes for ShopNest. Copy to /etc/supervisor/conf.d/shopnest.conf,
; then: supervisorctl reread && supervisorctl update

[program:shopnest-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/shopnest/artisan queue:work --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/shopnest/storage/logs/queue.log
stopwaitsecs=3600

; Server-side rendering (needs `npm run build:ssr` on deploy and INERTIA_SSR_ENABLED=true).
[program:shopnest-ssr]
command=php /var/www/shopnest/artisan inertia:start-ssr
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/www/shopnest/storage/logs/ssr.log
